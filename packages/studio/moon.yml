$schema: "https://moonrepo.dev/schemas/project.json"

id: "studio"
language: "typescript"
layer: "application"
stack: "frontend"
tags:
  - "typescript"
  - "rust"
  - "tauri"
  - "cli"
  - "react"

project:
  name: "@dnam-project/studio"
  description: "Unified Rust/Node dnam CLI and Tauri v2 Desktop Studio for DNAM"

dependsOn:
  - "engine"
  - "js"
  - "ui"
  - "trainer"

tasks:
  cli:
    command: "node"
    args:
      - "./packages/studio/bin/dnam.mjs"
    deps:
      - "~:build-rust-debug"
    env:
      DNAM_CARGO_PROFILE: "debug"
    preset: "utility"
    options:
      runFromWorkspaceRoot: true
    tags:
      - "cli"

  dev:
    command: "pnpm"
    args:
      - "exec"
      - "vite"
    deps:
      - "js:build-ts"
      - "ui:build"
    preset: "server"

  tauri-dev:
    command: "pnpm"
    args:
      - "exec"
      - "tauri"
      - "dev"
    deps:
      - "js:build-ts"
      - "ui:build"
    preset: "server"

  format:
    type: "run"
    script: "pnpm exec biome format --write . && cargo fmt --package dnam-studio"
    options:
      cache: false
      runInCI: false
    tags:
      - "format"

  format-check:
    script: "pnpm exec biome format . && cargo fmt --package dnam-studio -- --check"
    inputs:
      - "Cargo.toml"
      - "build.rs"
      - "package.json"
      - "playwright.config.ts"
      - "tauri.conf.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "bin/**/*"
      - "capabilities/**/*"
      - "rust/**/*"
      - "src/**/*"
      - "tests/**/*"
      - "/biome.json"
      - "/Cargo.toml"
      - "/pnpm-lock.yaml"
    tags:
      - "quality"
      - "format"

  lint:
    script: "pnpm exec biome check . && cargo clippy --package dnam-studio --all-targets -- -D warnings"
    deps:
      - "~:build-ts"
    inputs:
      - "Cargo.toml"
      - "build.rs"
      - "package.json"
      - "playwright.config.ts"
      - "tauri.conf.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "bin/**/*"
      - "capabilities/**/*"
      - "icons/**/*"
      - "isolation/**/*"
      - "rust/**/*"
      - "src/**/*"
      - "tests/**/*"
      - "/biome.json"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/pnpm-lock.yaml"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
      - "/packages/trainer/Cargo.toml"
      - "/packages/trainer/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "quality"
      - "lint"

  typecheck:
    script: "pnpm exec tsc -p tsconfig.json --noEmit && cargo check --package dnam-studio --all-targets"
    deps:
      - "js:build-ts"
      - "ui:build"
      - "~:build-ts"
    inputs:
      - "Cargo.toml"
      - "build.rs"
      - "package.json"
      - "playwright.config.ts"
      - "tauri.conf.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "capabilities/**/*"
      - "icons/**/*"
      - "isolation/**/*"
      - "rust/**/*"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/pnpm-lock.yaml"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
      - "/packages/trainer/Cargo.toml"
      - "/packages/trainer/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "quality"
      - "typecheck"

  build-rust-debug:
    type: "build"
    command: "cargo"
    args:
      - "build"
      - "--package"
      - "dnam-studio"
    deps:
      - "~:build-ts"
    inputs:
      - "Cargo.toml"
      - "build.rs"
      - "tauri.conf.json"
      - "capabilities/**/*"
      - "icons/**/*"
      - "isolation/**/*"
      - "rust/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
      - "/packages/trainer/Cargo.toml"
      - "/packages/trainer/src/**/*"
    options:
      cache: false
      mutex: "cargo"
      outputStyle: "buffer-only-failure"
    tags:
      - "build"

  build-rust:
    type: "build"
    command: "cargo"
    args:
      - "build"
      - "--package"
      - "dnam-studio"
      - "--release"
    deps:
      - "~:build-ts"
    inputs:
      - "Cargo.toml"
      - "build.rs"
      - "tauri.conf.json"
      - "capabilities/**/*"
      - "icons/**/*"
      - "isolation/**/*"
      - "rust/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
      - "/packages/trainer/Cargo.toml"
      - "/packages/trainer/src/**/*"
    options:
      cache: false
      mutex: "cargo"
      outputStyle: "buffer-only-failure"
    tags:
      - "build"

  build-ts:
    type: "build"
    script: "pnpm exec vite build --mode lib && pnpm exec tsc -p tsconfig.build.json --emitDeclarationOnly && pnpm exec vite build"
    deps:
      - "js:build-ts"
      - "ui:build"
    inputs:
      - "index.html"
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "src/**/*"
      - "!src/**/*.test.*"
      - "/pnpm-lock.yaml"
    outputs:
      - "dist/**/*"
      - "dist-app/**/*"
    options:
      outputStyle: "buffer-only-failure"
    tags:
      - "build"

  build:
    type: "build"
    command: "noop"
    deps:
      - "js:build"
      - "ui:build"
      - "~:build-rust"
      - "~:build-ts"
    tags:
      - "build"

  test-rust:
    command: "cargo"
    args:
      - "test"
      - "--package"
      - "dnam-studio"
    deps:
      - "~:build-ts"
    inputs:
      - "Cargo.toml"
      - "build.rs"
      - "tauri.conf.json"
      - "capabilities/**/*"
      - "icons/**/*"
      - "isolation/**/*"
      - "rust/**/*"
      - "tests/**/*.rs"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
      - "/packages/trainer/Cargo.toml"
      - "/packages/trainer/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "test"

  test:
    command: "pnpm"
    args:
      - "exec"
      - "vitest"
      - "run"
    deps:
      - "~:build-ts"
      - "~:test-rust"
    inputs:
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "bin/**/*"
      - "isolation/**/*"
      - "src/**/*"
      - "tests/**/*.ts"
      - "tests/**/*.tsx"
      - "!tests/e2e/**/*"
      - "/pnpm-lock.yaml"
    tags:
      - "test"

  test-e2e:
    type: "run"
    command: "pnpm"
    args:
      - "exec"
      - "playwright"
      - "test"
    deps:
      - "~:build-ts"
    inputs:
      - "package.json"
      - "playwright.config.ts"
      - "index.html"
      - "vite.config.ts"
      - "src/**/*"
      - "tests/e2e/**/*"
      - "/pnpm-lock.yaml"
    options:
      runInCI: "skip"
    tags:
      - "e2e"

  coverage-rust:
    type: "run"
    command: "cargo"
    args:
      - "llvm-cov"
      - "--package"
      - "dnam-studio"
      - "--fail-under-lines"
      - "95"
    deps:
      - "~:build-ts"
    inputs:
      - "Cargo.toml"
      - "build.rs"
      - "tauri.conf.json"
      - "capabilities/**/*"
      - "icons/**/*"
      - "isolation/**/*"
      - "rust/**/*"
      - "tests/**/*.rs"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
      - "/packages/trainer/Cargo.toml"
      - "/packages/trainer/src/**/*"
    options:
      mutex: "cargo"
      runInCI: "skip"
    tags:
      - "coverage"

  coverage:
    type: "run"
    command: "pnpm"
    args:
      - "exec"
      - "vitest"
      - "run"
      - "--coverage"
    deps:
      - "~:build-ts"
      - "~:coverage-rust"
    inputs:
      - "package.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "bin/**/*"
      - "isolation/**/*"
      - "src/**/*"
      - "tests/**/*.ts"
      - "tests/**/*.tsx"
      - "!tests/e2e/**/*"
      - "/pnpm-lock.yaml"
    options:
      runInCI: "skip"
    tags:
      - "coverage"
