$schema: "https://moonrepo.dev/schemas/project.json"

id: "trainer"
language: "rust"
layer: "library"
stack: "systems"
tags:
  - "rust"
  - "dsp"
  - "trainer"
  - "ml"
  - "cli"

project:
  name: "dnam-trainer"
  description: "Pure-Rust Analytical Variable-Projection (VarPro) Two-Sweep System-Identification Trainer for DNAM"

dependsOn:
  - "engine"

tasks:
  cli:
    command: "cargo"
    args:
      - "run"
      - "--package"
      - "dnam-trainer"
      - "--bin"
      - "dnam-train"
      - "--"
    preset: "utility"
    options:
      runFromWorkspaceRoot: true
    tags:
      - "cli"

  format:
    type: "run"
    command: "cargo"
    args:
      - "fmt"
      - "--package"
      - "dnam-trainer"
    options:
      cache: false
      runInCI: false
    tags:
      - "format"

  format-check:
    command: "cargo"
    args:
      - "fmt"
      - "--package"
      - "dnam-trainer"
      - "--"
      - "--check"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "benches/**/*"
      - "/Cargo.toml"
    tags:
      - "quality"
      - "format"

  lint:
    command: "cargo"
    args:
      - "clippy"
      - "--package"
      - "dnam-trainer"
      - "--all-targets"
      - "--all-features"
      - "--"
      - "-D"
      - "warnings"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "benches/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "quality"
      - "lint"

  typecheck:
    command: "cargo"
    args:
      - "check"
      - "--package"
      - "dnam-trainer"
      - "--all-targets"
      - "--all-features"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "benches/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "quality"
      - "typecheck"

  build:
    type: "build"
    command: "cargo"
    args:
      - "build"
      - "--package"
      - "dnam-trainer"
      - "--release"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
    options:
      mutex: "cargo"
      outputStyle: "buffer-only-failure"
    tags:
      - "build"

  test:
    command: "cargo"
    args:
      - "test"
      - "--package"
      - "dnam-trainer"
      - "--all-features"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
    options:
      mutex: "cargo"
    tags:
      - "test"

  coverage:
    type: "run"
    command: "cargo"
    args:
      - "llvm-cov"
      - "--package"
      - "dnam-trainer"
      - "--all-features"
      - "--fail-under-lines"
      - "95"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
    options:
      mutex: "cargo"
      runInCI: "skip"
    tags:
      - "coverage"

  bench:
    type: "run"
    command: "cargo"
    args:
      - "bench"
      - "--package"
      - "dnam-trainer"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "benches/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
    options:
      cache: false
      mutex: "cargo"
      runInCI: false
    tags:
      - "bench"
