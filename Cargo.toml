[workspace]
resolver = "3"
members = ["packages/engine", "packages/python", "packages/js", "packages/studio"]
default-members = ["packages/engine", "packages/studio"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-DNAM-1.0.0"
repository = "https://github.com/dnam-project/dnam"

[workspace.dependencies]
dnam-engine = { path = "packages/engine", default-features = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive", "simd"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.6"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py314"] }
numpy = "0.30"
napi = { version = "3.15", default-features = false, features = ["napi8", "compat-mode"] }
napi-derive = "3.6"
napi-build = "2.6"
tauri = { version = "2", features = ["isolation"] }
tauri-build = { version = "2", features = ["isolation"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
ptr_as_ptr = "deny"
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
