[package]
name = "dnam-trainer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust Analytical Variable-Projection (VarPro) Two-Sweep System-Identification Trainer for DNAM"

[lints]
workspace = true

[features]
default = ["cli", "solver"]
cli = ["dep:clap", "solver"]
solver = []
wasm-solver = []

[dependencies]
clap = { workspace = true, optional = true }
dnam-engine = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true

[dev-dependencies]
criterion.workspace = true
dnam-fixtures.workspace = true
proptest.workspace = true

[[bin]]
name = "dnam-train"
path = "src/bin/dnam_train.rs"
required-features = ["cli"]

[[bench]]
name = "bench_trainer"
harness = false
