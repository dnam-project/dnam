$schema: "https://moonrepo.dev/schemas/project.json"

id: "python"
language: "python"
layer: "library"
stack: "backend"
tags:
  - "python"
  - "rust"
  - "pyo3"

project:
  name: "dnam-python"
  description: "Idiomatic Python 3.15 interface & zero-copy PyO3 (abi3.abi3t) NumPy SIMD engine bindings for DNAM"

dependsOn:
  - "engine"

tasks:
  format:
    type: "run"
    script: "uv run --no-sync ruff format packages/python && cargo fmt --package dnam-python"
    deps:
      - "~:build"
    options:
      runFromWorkspaceRoot: true
      cache: false
      runInCI: false
    tags:
      - "format"

  format-check:
    script: "uv run --no-sync ruff format --check packages/python && cargo fmt --package dnam-python -- --check"
    deps:
      - "~:build"
    inputs:
      - "Cargo.toml"
      - "pyproject.toml"
      - "examples/**/*"
      - "rust/**/*"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/pyproject.toml"
      - "/uv.lock"
    options:
      runFromWorkspaceRoot: true
    tags:
      - "quality"
      - "format"

  lint:
    script: "uv run --no-sync ruff check packages/python && cargo clippy --package dnam-python --all-targets -- -D warnings"
    deps:
      - "~:build"
    inputs:
      - "Cargo.toml"
      - "pyproject.toml"
      - "examples/**/*"
      - "rust/**/*"
      - "src/**/*"
      - "tests/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/pyproject.toml"
      - "/uv.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
    options:
      runFromWorkspaceRoot: true
      mutex: "cargo"
    tags:
      - "quality"
      - "lint"

  typecheck:
    command: "uv"
    args:
      - "run"
      - "--no-sync"
      - "pyrefly"
      - "check"
      - "--min-severity=warn"
      - "packages/python"
    deps:
      - "~:build"
    inputs:
      - "pyproject.toml"
      - "examples/**/*"
      - "src/**/*"
      - "tests/**/*"
      - "/pyproject.toml"
      - "/uv.lock"
    options:
      runFromWorkspaceRoot: true
    tags:
      - "quality"
      - "typecheck"

  build:
    type: "build"
    command: "uv"
    args:
      - "sync"
      - "--locked"
    inputs:
      - "Cargo.toml"
      - "pyproject.toml"
      - "rust/**/*"
      - "src/**/*.py"
      - "src/**/*.pyi"
      - "/.cargo/config.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/pyproject.toml"
      - "/uv.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
      - "/packages/trainer/pyproject.toml"
    options:
      runFromWorkspaceRoot: true
      mutex: "cargo"
      outputStyle: "buffer-only-failure"
    tags:
      - "build"

  test:
    command: "uv"
    args:
      - "run"
      - "--no-sync"
      - "pytest"
      - "packages/python/tests"
    deps:
      - "~:build"
    inputs:
      - "pyproject.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/pyproject.toml"
      - "/uv.lock"
    options:
      runFromWorkspaceRoot: true
    tags:
      - "test"

  test-full:
    type: "run"
    command: "uv"
    args:
      - "run"
      - "--no-sync"
      - "pytest"
      - "packages/python/tests"
      - "-m"
      - "slow or not slow"
    deps:
      - "~:build"
    inputs:
      - "pyproject.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/pyproject.toml"
      - "/uv.lock"
    options:
      runFromWorkspaceRoot: true
      runInCI: "skip"
    tags:
      - "test"

  coverage:
    type: "run"
    command: "uv"
    args:
      - "run"
      - "--no-sync"
      - "pytest"
      - "packages/python/tests"
      - "--cov=dnam"
      - "--cov-report=term-missing"
      - "--cov-fail-under=95"
    deps:
      - "~:build"
    inputs:
      - "pyproject.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/pyproject.toml"
      - "/uv.lock"
    options:
      runFromWorkspaceRoot: true
      runInCI: "skip"
    tags:
      - "coverage"

  bench:
    type: "run"
    command: "uv"
    args:
      - "run"
      - "--no-sync"
      - "pytest"
      - "packages/python/tests/benchmarks"
      - "--benchmark-enable"
    deps:
      - "~:build"
    inputs:
      - "pyproject.toml"
      - "src/**/*"
      - "tests/**/*"
      - "/pyproject.toml"
      - "/uv.lock"
    options:
      runFromWorkspaceRoot: true
      cache: false
      runInCI: false
    tags:
      - "bench"

  profile:
    type: "run"
    script: >-
      uv run --no-sync python -m profiling.sampling run --mode cpu -o target/profile_sdk.pstats packages/python/tests/benchmarks/profile_sdk.py
      || uv run --no-sync python -m profiling.tracing -o target/profile_sdk.pstats packages/python/tests/benchmarks/profile_sdk.py
    deps:
      - "~:build"
    inputs:
      - "pyproject.toml"
      - "src/**/*"
      - "tests/benchmarks/profile_sdk.py"
      - "/pyproject.toml"
      - "/uv.lock"
    options:
      runFromWorkspaceRoot: true
      cache: false
      runInCI: false
    tags:
      - "profile"

  wheel:
    type: "build"
    command: "uv"
    args:
      - "run"
      - "--no-sync"
      - "--python"
      - "3.15t"
      - "maturin"
      - "build"
      - "--release"
      - "--manifest-path"
      - "packages/python/Cargo.toml"
      - "--out"
      - "target/wheels"
    deps:
      - "~:build"
    inputs:
      - "Cargo.toml"
      - "pyproject.toml"
      - "rust/**/*"
      - "src/**/*.py"
      - "src/**/*.pyi"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/packages/engine/Cargo.toml"
      - "/packages/engine/src/**/*"
    options:
      runFromWorkspaceRoot: true
      mutex: "cargo"
    tags:
      - "build"
      - "wheel"

  wheel-check:
    type: "run"
    command: "uv"
    args:
      - "run"
      - "--no-sync"
      - "pytest"
      - "packages/python/tests/test_public_api.py"
      - "-m"
      - "wheel"
    deps:
      - "~:wheel"
    inputs:
      - "pyproject.toml"
      - "src/**/*"
      - "tests/test_public_api.py"
    options:
      runFromWorkspaceRoot: true
      cache: false
    tags:
      - "quality"
      - "wheel"
