[project]
name = "dnam-workspace"
version = "0.1.0"
description = "Dynamic Neural Audio Modeler (DNAM) Workspace"
requires-python = ">=3.15"
license = { text = "LicenseRef-DNAM-1.0.0" }
dependencies = []

[dependency-groups]
dev = [
    "dnam",
    "dnam-trainer",
    "maturin>=1.16.0,<2.0.0",
    "pytest>=8.3.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.0.0",
    "hypothesis[numpy]>=6.120.0",
    "hypothesis-jsonschema>=0.23.0",
    "ruff>=0.9.0",
    "pyrefly>=0.15.0",
]

[tool.uv]
package = false
required-version = ">=0.13.7"
exclude-newer = "1 day"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = [
    "rocm[libraries]==10.0.*; sys_platform == 'linux'",
    "rocm-sdk-core==10.0.*; sys_platform == 'linux'",
    "rocm-sdk-libraries==10.0.*; sys_platform == 'linux'",
    "triton-rocm~=3.9.0; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm10.0"
explicit = true

[tool.uv.exclude-newer-package]
torch = false
rocm = false
rocm-sdk-core = false
rocm-sdk-libraries = false
triton-rocm = false
rocm-sdk-device-gfx1100 = false
rocm-sdk-device-gfx1101 = false
rocm-sdk-device-gfx1102 = false
rocm-sdk-device-gfx1151 = false
rocm-sdk-device-gfx1200 = false
rocm-sdk-device-gfx1201 = false
rocm-sdk-device-gfx1250 = false
rocm-sdk-device-gfx90a = false
rocm-sdk-device-gfx942 = false
rocm-sdk-device-gfx950 = false

[tool.uv.workspace]
members = ["packages/python", "packages/trainer"]

[tool.uv.sources]
dnam = { workspace = true }
dnam-trainer = { workspace = true }
torch = [
    { index = "pytorch-rocm", marker = "extra == 'rocm' and (sys_platform == 'linux')" },
]
rocm = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-core = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-libraries = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1100 = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1101 = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1102 = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1151 = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1200 = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1201 = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx1250 = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx90a = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx942 = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rocm-sdk-device-gfx950 = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
target-version = "py315"
line-length = 100
src = [
    "packages/python/src",
    "packages/python/tests",
    "packages/python/examples",
    "packages/trainer/src",
    "packages/trainer/tests",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PT",
    "NPY",
    "RUF",
]

[tool.pyrefly]
python-version = "3.15"
project-includes = [
    "packages/python/src",
    "packages/python/tests",
    "packages/python/examples",
    "packages/trainer/src",
    "packages/trainer/tests",
    "tests",
]
search-path = [
    "packages/python/src",
    "packages/python/tests",
    "packages/python/examples",
    "packages/trainer/src",
    "packages/trainer/tests",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests", "packages/trainer/tests", "tests"]
pythonpath = ["packages/python/tests", "packages/trainer/tests", "tests"]
addopts = "-ra --strict-markers --benchmark-disable --import-mode=importlib -m 'not slow and not wheel'"
markers = [
    "slow: exhaustive cross-product matrix tests (run via moon run python:test-full)",
    "wheel: dual-ABI cp315-abi3.abi3t wheel install verification across 3.15 and 3.15t (run via moon run python:wheel-check)",
]

[tool.coverage.run]
source = ["dnam", "dnam_trainer"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
