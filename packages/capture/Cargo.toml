[package]
name = "dnam-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust Wasm32-Safe Capture, Analytical VarPro System-ID Engine & Single-File .dnam-proj (DNPJ) Container for DNAM"

[lints]
workspace = true

[features]
default = ["solver"]
solver = []
wasm-solver = []

[dependencies]
dnam-engine = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true

[dev-dependencies]
criterion.workspace = true
dnam-fixtures.workspace = true
proptest.workspace = true

[[bench]]
name = "bench_capture"
harness = false
