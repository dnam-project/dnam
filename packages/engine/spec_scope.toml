# DNAM Rust Engine (`packages/engine`) — Specification Rule Scope Manifest
#
# Every `r[<id>]` rule defined in `docs/specs/**/*.md` MUST appear in this manifest
# under `[rules]` with `scope = "engine"` (verified in `packages/engine/tests/*.rs`)
# or `scope = "out-of-scope"` (with a non-empty `reason` explaining which other
# package or suite owns verification).

