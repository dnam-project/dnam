$schema: "https://moonrepo.dev/schemas/project.json"

id: "tests"
language: "typescript"
layer: "application"
stack: "systems"
tags:
  - "typescript"
  - "tests"
  - "guardrails"

project:
  name: "dnam-workspace-tests"
  description: "Workspace-wide architecture, documentation, and specification guardrail tests for DNAM"

dependsOn: []

tasks:
  format:
    type: "run"
    command: "pnpm"
    args:
      - "exec"
      - "biome"
      - "format"
      - "--write"
      - "tests"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
    tags:
      - "format"

  format-check:
    command: "pnpm"
    args:
      - "exec"
      - "biome"
      - "format"
      - "tests"
    inputs:
      - "*.ts"
      - "*.json"
      - "/biome.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      runFromWorkspaceRoot: true
    tags:
      - "quality"
      - "format"

  lint:
    command: "pnpm"
    args:
      - "exec"
      - "biome"
      - "check"
      - "tests"
    inputs:
      - "*.ts"
      - "*.json"
      - "/biome.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      runFromWorkspaceRoot: true
    tags:
      - "quality"
      - "lint"

  typecheck:
    command: "pnpm"
    args:
      - "exec"
      - "tsc"
      - "-p"
      - "tests/tsconfig.json"
      - "--noEmit"
    inputs:
      - "*.ts"
      - "tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      runFromWorkspaceRoot: true
    tags:
      - "quality"
      - "typecheck"

  build:
    type: "build"
    command: "pnpm"
    args:
      - "exec"
      - "tsc"
      - "-p"
      - "tests/tsconfig.json"
      - "--noEmit"
    inputs:
      - "*.ts"
      - "tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      outputStyle: "buffer-only-failure"
      runFromWorkspaceRoot: true
    tags:
      - "build"

  test:
    command: "pnpm"
    args:
      - "exec"
      - "vitest"
      - "run"
      - "tests/test_guardrails.test.ts"
    inputs:
      - "*.md"
      - "*.ts"
      - "tsconfig.json"
      - "/AGENTS.md"
      - "/CONTRIBUTING.md"
      - "/README.md"
      - "/CLA.md"
      - "/LICENSE"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/biome.json"
      - "/mise.toml"
      - "/.moon/*.yml"
      - "/docs/**/*.md"
      - "/packages/**/*.{toml,yml,json,html}"
      - "/packages/**/*.md"
      - "/packages/**/*.mjs"
      - "/packages/**/*.rs"
      - "/packages/**/*.ts"
      - "/packages/**/*.tsx"
      - "/**/*.py"
    options:
      runFromWorkspaceRoot: true
    tags:
      - "test"
